<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revue artistes</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">Revue artistes</a>
    <a class="export" href="/export.csv" download="revue-artistes.csv">Exporter la revue</a>
  </header>
  <main>
    <nav class="tabs" aria-label="Rapports">
      <button type="button" data-tab="artists" aria-pressed="true">Artistes <span id="artist-count"></span></button>
      <button type="button" data-tab="validated" aria-pressed="false">Validés <span id="validated-count"></span></button>
      <button type="button" data-tab="tracks" aria-pressed="false">Morceaux <span id="track-count"></span></button>
      <button type="button" data-tab="report" aria-pressed="false">Récap</button>
      <button type="button" data-tab="job" aria-pressed="false">Job</button>
    </nav>
    <section id="artists" aria-label="Revue des artistes">
      <div class="page-actions"><button id="save-all" type="button" class="primary" disabled>Valider cette page</button><span id="progress" role="status"></span></div>
      <div class="toolbar">
        <label class="search">Rechercher<input id="search" type="search" placeholder="Artiste ou morceau…" autocomplete="off"></label>
        <label>Rôle<select id="role" aria-label="Rôle"><option value="">Tous les rôles</option><option>Producer</option><option>DJ</option><option>Singer</option><option>MC</option><option value="unknown">Sans rôle</option></select></label>
        <label>Proposition IA<select id="proposal" aria-label="Proposition IA"><option value="">Toutes</option><option value="keep">Garder</option><option value="exclude">Bloat possible</option></select></label>
        <label>Tri retenu<select id="review" aria-label="Tri retenu"><option value="">Tous</option><option value="keep">Garder</option><option value="exclude">Écarter (idgaf)</option><option value="modified">Mes corrections</option></select></label>
        <label id="recap-filter-label" hidden>Filtre du récap<select id="recap-filter" aria-label="Filtre du récap"></select></label>
        <label class="check"><input id="attention" type="checkbox">Cas à vérifier</label>
        <button id="reset" type="button" class="text-button">Réinitialiser</button>
      </div>
      <div class="workspace">
        <div class="list-panel">
          <div class="list-heading"><span id="visible-count"></span><label>Trier<select id="sort"><option value="name">Nom A → Z</option><option value="count">Nombre de morceaux</option><option value="attention">Cas à vérifier d’abord</option></select></label></div>
          <div class="table-wrap"><table><caption class="sr-only">Artistes, valeurs retenues éditables et anomalies</caption><thead><tr><th scope="col">Artiste / anomalies</th><th scope="col" class="num">Sons</th><th scope="col">Profils</th><th scope="col">Rôles</th><th scope="col">Bass-related</th><th scope="col">Tri retenu</th></tr></thead><tbody id="rows"></tbody></table></div>
          <p id="empty" class="empty" hidden>Aucun artiste dans cette liste.</p>
          <div class="pagination"><button id="previous-page" type="button">Précédente</button><label>Page<select id="page-number" aria-label="Page"></select></label><span id="page-count"></span><button id="next-page" type="button">Suivante</button></div>
        </div>
        <aside id="detail" aria-label="Dossier de l’artiste" hidden></aside>
      </div>
    </section>
    <section id="tracks" hidden aria-label="Collection de morceaux">
      <div class="toolbar"><label class="search">Rechercher un morceau<input id="track-search" type="search" placeholder="Titre, artiste ou genre…"></label></div>
      <div id="track-table" class="table-wrap"></div>
      <div class="pagination"><button id="previous-tracks" type="button">Précédente</button><label>Page<select id="track-page" aria-label="Page des morceaux"></select></label><span id="track-pages"></span><button id="next-tracks" type="button">Suivante</button></div>
    </section>
    <section id="report" hidden aria-label="Résultats et limites du pilote"></section>
    <section id="job" hidden aria-label="Suivi de l’enrichissement">
      <div class="toolbar"><span>GPT-6 Luna · low · Abonnement ChatGPT</span>
        <label>Artistes par lot<input id="job-size" type="number" min="1" max="10" value="5"></label>
        <button id="job-start" class="primary" type="button">Démarrer / reprendre</button>
        <button id="job-pause" type="button">Pause après le lot</button>
        <button id="job-stop" type="button">Arrêter</button>
        <button id="job-retry" type="button">Réessayer les erreurs</button>
        <button id="job-refresh" type="button">Actualiser les propositions</button>
      </div>
      <p id="job-state" role="status"></p>
      <div id="job-counts" class="report-grid"></div>
      <p id="job-error" role="alert"></p>
      <div class="table-wrap"><table><caption>Journal</caption><thead><tr><th>Heure</th><th>Étape</th></tr></thead><tbody id="job-log"></tbody></table></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="failure" role="alert" hidden><p>Le pilote n’a pas pu être chargé.</p><button id="retry" type="button">Réessayer</button></div>
  </main>
</body>
</html>
