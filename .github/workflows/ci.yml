name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Checks and Windows build
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Run the tests
        run: uv run pytest

      - name: Smoke test from the sources
        run: uv run python -m mtee --data-dir .local/ci/sources --smoke-test

      - name: Build the Windows distribution
        run: pwsh -File scripts/build_windows.ps1

      - name: Smoke test the packaged application
        run: pwsh -File scripts/smoke_packaged.ps1 -DataDir .local/ci/packaged

      - name: Publish the build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mtee-windows-dir
          path: dist/MTEE
          retention-days: 7
