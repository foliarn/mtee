[project]
name = "mtee"
version = "0.2.0"
description = "Music Tagging and Editing Explorer — desktop application for a local audio collection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # Essentials only: the add-ons of the full PySide6 wheel bring Qt WebEngine
    # and Quick3D, which MTEE does not use and which weigh on the distribution.
    "PySide6-Essentials>=6.8,<6.10",
    "mutagen>=1.47",
    "numpy>=2.5.3",
    # Version comparisons of plugin packages and the Marketplace (plan 123).
    "packaging>=24",
    "winrt-runtime>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-media>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-media-playback>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-storage>=3.2.1,<4 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1,<4 ; sys_platform == 'win32'",
]

[project.scripts]
mtee = "mtee.app:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pyinstaller>=6.10",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run: parallel (one worker per CPU, tests handed out one by one so a slow
# file does not hold a worker idle) and without the `slow` tests, which check
# wall-clock speed and take seconds each. `uv run pytest -m ""` runs every test;
# `-n 0` runs in one process for debugging. A test still running after 2 minutes is
# stopped with the stack of every thread, instead of hanging the run.
addopts = "-q -n auto --dist worksteal -m \"not slow\""
timeout = 120
timeout_method = "thread"
qt_api = "pyside6"
markers = [
    "native_audio: requires the pinned Windows libmpv runtime; missing runtime is a failure, not a skip",
    "windows_file_ops: requires native Windows file operation semantics",
    "slow: wall-clock speed guard (seconds per test); off by default, run with -m slow or -m ''",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Local agent worktrees and tool state, never part of the project.
extend-exclude = [".claude", ".codex", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Qt imposes the name of the overridden methods, of the signals and of the
# properties read by QML; renaming them would break the binding.
"src/mtee/models/*.py" = ["N802", "N815"]
"tests/helpers/plugins_view_fake.py" = ["N802", "N815"]
"src/mtee/plugins/conversion/models.py" = ["N802", "N815"]
"src/mtee/plugins/context.py" = ["N802", "N815"]
# The sample plugin shows what QML reads: Qt slots and properties keep their camelCase names.
"tests/plugins/sample/*.py" = ["N802", "N815"]
"src/mtee/platform/windows_frame.py" = ["N802", "N815"]
"src/mtee/services/jobs.py" = ["N815"]
"src/mtee/services/player_service.py" = ["N815"]
"src/mtee/services/media_controls.py" = ["N815"]
"tests/*" = ["S101"]

[tool.pyright]
include = ["src", "tests", "plugins"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
